<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5602E">
<title>Rhine Guide — Design Test</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F6EEDD;
    --parchment-deep: #EFE0BE;
    --gold: #C9A05C;
    --terracotta: #B5602E;
    --ink: #5A4327;
    --ink-soft: #8A6A34;
    --cream-text: #FCEFDD;
    --pad: clamp(16px, 5vw, 24px);
    --sans: system-ui, -apple-system, sans-serif;
    --scale: 1;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--parchment);
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    height: 100%;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  .header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px var(--pad) 12px;
    border-bottom: 1px solid var(--gold);
  }

  .app-name { font-size: clamp(15px, 4vw, 18px); font-weight: 600; margin: 0; }

  .header-controls { display: flex; align-items: center; gap: 6px; font-family: var(--sans); }

  .pill-btn {
    background: var(--parchment-deep);
    border: 1px solid var(--gold);
    color: var(--ink-soft);
    border-radius: 8px;
    font-size: 12px;
    padding: 4px 8px;
    line-height: 1;
    cursor: pointer;
  }

  .pill-btn.active { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  .tabs {
    flex: 0 0 auto;
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 12px var(--pad) 14px;
    font-family: var(--sans);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 20px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .tab.active { background: var(--terracotta); color: var(--cream-text); font-weight: 500; }

  .content { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--pad) var(--pad); max-width: 480px; margin: 0 auto; width: 100%; }

  .photo {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 6px 0 22px;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(180deg, #E8D9B5 0%, #D9C193 55%, #B98B4F 100%);
  }

  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(180, 90, 40, 0.9);
    color: var(--cream-text);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: var(--sans);
  }

  .station-title {
    margin: 0 0 14px;
    text-align: center;
    font-size: calc(clamp(21px, 6vw, 28px) * var(--scale));
    font-weight: 600;
  }

  .desc {
    margin: 0 auto 22px;
    max-width: 34ch;
    text-align: center;
    font-size: calc(clamp(15px, 4vw, 16px) * var(--scale));
    line-height: 1.65;
  }

  .stats { display: flex; gap: 14px; margin-bottom: 22px; }
  .stat { flex: 1; background: var(--parchment-deep); border: 1px solid var(--gold); border-radius: 10px; padding: 12px 10px; text-align: center; }
  .stat p:first-child { margin: 0 0 4px; font-size: 11px; color: var(--ink-soft); font-family: var(--sans); }
  .stat p:last-child { margin: 0; font-size: calc(16px * var(--scale)); font-weight: 600; color: var(--terracotta); }

  .actions { display: flex; gap: 12px; margin-bottom: 8px; }
  .btn-play {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--terracotta); color: var(--cream-text); border: none; border-radius: 10px;
    padding: 12px; font-family: var(--sans); font-size: 15px; font-weight: 500;
  }
  .btn-check {
    width: 48px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1.5px solid var(--gold); border-radius: 10px;
    color: var(--ink-soft); font-size: 20px;
  }
  .btn-check.done { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px var(--pad);
    border-top: 1px solid var(--gold);
    font-family: var(--sans);
  }

  .nav-arrow {
    background: var(--parchment-deep);
    border: 1px solid var(--gold);
    color: var(--ink);
    border-radius: 10px;
    width: 36px; height: 36px;
    font-size: 16px;
  }
  .nav-arrow:disabled { opacity: 0.35; }

  .progress-track { flex: 1; height: 6px; background: var(--parchment-deep); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--terracotta); }
  .progress-label { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }

  @media (max-width: 340px) {
    .stats { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <p class="app-name">Rhine Guide</p>
    <div class="header-controls">
      <span class="pill-btn active" data-lang="en">EN</span>
      <span class="pill-btn" data-lang="ru">RU</span>
      <span class="pill-btn" id="fontMinus">A-</span>
      <span class="pill-btn" id="fontPlus">A+</span>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="content">
    <div class="photo">
      <img id="photoImg" src="" alt="">
      <div class="badge" id="badge"></div>
    </div>

    <h1 class="station-title" id="stationTitle"></h1>
    <p class="desc" id="stationDesc"></p>

    <div class="stats">
      <div class="stat"><p id="statTownLabel"></p><p id="statTown"></p></div>
      <div class="stat"><p id="statBuiltLabel"></p><p id="statBuilt"></p></div>
    </div>

    <div class="actions">
      <button class="btn-play" id="playBtn">▶ <span id="playLabel"></span></button>
      <button class="btn-check" id="checkBtn" aria-label="Mark as visited">✓</button>
    </div>
  </div>

  <div class="footer">
    <button class="nav-arrow" id="prevBtn" aria-label="Previous station">←</button>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <span class="progress-label" id="progressLabel"></span>
    <button class="nav-arrow" id="nextBtn" aria-label="Next station">→</button>
  </div>

</div>

<script>
const STATIONS = [
  { id:"stolzenfels", name:"Schloss Stolzenfels", town:"Koblenz", built:"13th c. (rebuilt 1836–42)", builtRu:"XIII век (перестроен в 1836–42)",
    facts:"A castle stood here from the 1200s. It watched over ships on the river, and over some nearby silver mines. French soldiers destroyed it. Then, in the 1830s, Prussia rebuilt it as a grand new palace, for a future king.",
    factsRu:"Замок стоял здесь с XIII века. Он следил за кораблями на реке и за соседними серебряными шахтами. Французские солдаты его разрушили. Потом, в 1830-х годах, Пруссия построила на этом месте новый роскошный дворец — для будущего короля." },
  { id:"lahneck", name:"Burg Lahneck", town:"Lahnstein", built:"13th century", builtRu:"XIII век",
    facts:"Built in the 1200s, right where the small river Lahn meets the Rhine. French troops destroyed it — first in 1689, and again in 1794. Like so many castles here, it was rebuilt in the 1800s.",
    factsRu:"Построен в XIII веке, там, где маленькая река Лан впадает в Рейн. Французские войска разрушили его — сначала в 1689 году, потом снова в 1794-м. Как и многие замки здесь, его восстановили в XIX веке." },
  { id:"marksburg", name:"Marksburg", town:"Braubach", built:"c. 1231", builtRu:"около 1231 года",
    facts:"This is the only castle on the whole Rhine that was never destroyed. Building started around 1231. Over hundreds of years, people kept adding new parts to it.",
    factsRu:"Это единственный замок на всём Рейне, который никогда не разрушали. Строительство началось около 1231 года. Сотни лет люди достраивали к нему новые части." },
  { id:"maus", name:"Burg Maus (\"Mouse Castle\")", town:"Wellmich / St. Goarshausen", built:"1356 (started)", builtRu:"начат в 1356 году",
    facts:"Building started in 1356. A powerful archbishop built it to protect his own river tolls, against the family who built 'the Cat' nearby. Over time it fell into disrepair, but no war ever destroyed it. It was restored around 1900.",
    factsRu:"Строительство началось в 1356 году. Могущественный архиепископ построил его, чтобы защищать свои речные пошлины от семьи, построившей соседний замок «Кот». Со временем он обветшал, но ни одна война его так и не разрушила. Его восстановили около 1900 года." },
  { id:"rheinfels", name:"Burg Rheinfels", town:"St. Goar", built:"1245", builtRu:"1245 год",
    facts:"Built in 1245 to collect tolls from ships. It grew into the biggest fortress on the whole Rhine. In 1692, it held out against 28,000 French soldiers. In 1794, French troops swept through the region, and the castle fell without a fight.",
    factsRu:"Построен в 1245 году, чтобы собирать пошлину с кораблей. Со временем он стал самой большой крепостью на всём Рейне. В 1692 году он выдержал осаду 28 000 французских солдат. Но в 1794 году французские войска прошли через регион, и замок сдался без боя." },
  { id:"katz", name:"Burg Katz (\"Cat Castle\")", town:"St. Goarshausen", built:"1371", builtRu:"1371 год",
    facts:"Built in 1371, to protect the local toll and to challenge a rival castle nearby. Napoleon had it blown up in 1806. It was rebuilt around 1896, using old drawings of the original.",
    factsRu:"Построен в 1371 году — чтобы защищать местную пошлину и бросать вызов соседнему замку-сопернику. Наполеон приказал взорвать его в 1806 году. Его восстановили около 1896 года по старым рисункам." },
  { id:"loreley", name:"Loreley-Felsen (\"The Loreley Rock\")", town:"St. Goarshausen", built:"Natural rock; legend from 1801", builtRu:"природная скала; легенда — с 1801 года",
    facts:"This is a steep rock, about 130 meters high. It sits at the narrowest point of the whole Rhine. The name likely means 'murmuring rock.' Today there's even a concert stage right on top of it.",
    factsRu:"Это крутая скала высотой около 130 метров. Она стоит в самом узком месте всего Рейна. Название, скорее всего, значит «бормочущая скала». Сегодня прямо на вершине скалы даже стоит концертная сцена." },
  { id:"sooneck", name:"Burg Sooneck", town:"Niederheimbach", built:"11th–12th c.", builtRu:"XI–XII века",
    facts:"Built in the 1000s or 1100s. Like its neighbor Reichenstein, it was home to robber knights. The emperor's army destroyed it in 1282. French troops destroyed it again in 1689. In 1842, the Prussian royal family restored it a final time.",
    factsRu:"Построен в XI или XII веке. Как и соседний Райхенштайн, он был домом рыцарей-разбойников. Армия императора разрушила его в 1282 году. Французские войска разрушили его снова в 1689-м. В 1842 году прусская королевская семья восстановила его в последний раз." },
  { id:"reichenstein", name:"Burg Reichenstein", town:"Trechtingshausen", built:"11th–13th c.", builtRu:"XI–XIII века",
    facts:"Built between the 1000s and 1200s. Robber knights lived here. The Archbishop of Mainz destroyed the castle once. The emperor's army destroyed it again in 1282, this time for good. In the late 1800s, a rich family rebuilt it in a fancy new style.",
    factsRu:"Построен между XI и XIII веками. Здесь жили рыцари-разбойники. Архиепископ Майнца разрушил замок один раз. В 1282 году армия императора разрушила его снова, на этот раз окончательно. В конце XIX века богатая семья восстановила его в новом, изысканном стиле." },
  { id:"rheinstein", name:"Burg Rheinstein", town:"Trechtingshausen", built:"c. 1282–1329", builtRu:"около 1282–1329 годов",
    facts:"Built in the late 1200s, first as a simple toll station. Later it was left empty and fell apart. In 1823, a Prussian prince bought the ruin and rebuilt it — the very first Rhine castle rebuilt in this new, romantic style.",
    factsRu:"Построен в конце XIII века, сначала просто как таможенный пост. Позже замок опустел и обветшал. В 1823 году прусский принц купил руину и восстановил её — это был самый первый рейнский замок, отстроенный в новом романтическом стиле." },
  { id:"gutenfels", name:"Burg Gutenfels", town:"Kaub", built:"1222", builtRu:"1222 год",
    facts:"Built in 1222, to help guard the river toll. In 1504, it survived a week-long siege — probably where its name comes from: 'Gutenfels' means 'good, solid rock.' Napoleon's men tore parts of it down; it was rebuilt from 1889.",
    factsRu:"Построен в 1222 году, чтобы охранять речную пошлину. В 1504 году он выдержал недельную осаду — вероятно, отсюда и название: «Гутенфельс» означает «добрая, крепкая скала». Люди Наполеона частично разрушили его, восстановили начиная с 1889 года." },
  { id:"pfalzgrafenstein", name:"Pfalzgrafenstein", town:"Kaub (river island)", built:"From 1326", builtRu:"с 1326 года",
    facts:"Built from 1326, on a small island in the middle of the river. Its only real job was collecting money from ships passing by. You can still only reach it by boat.",
    factsRu:"Построен начиная с 1326 года на маленьком острове посреди реки. Его единственная работа — собирать деньги с проплывающих кораблей. Добраться до него до сих пор можно только на лодке." },
  { id:"stahleck", name:"Burg Stahleck", town:"Bacharach", built:"12th century", builtRu:"XII век",
    facts:"Built in the 1100s, as a home for local counts. French troops destroyed it in 1689, along with the town below it. In the 1920s and 30s, people rebuilt it as a youth hostel — and it still is one today.",
    factsRu:"Построен в XII веке как резиденция местных графов. Французские войска разрушили его в 1689 году вместе с городом внизу. В 1920–30-х годах его восстановили как молодёжное общежитие — таким оно остаётся и сегодня." },
  { id:"maeuseturm", name:"Mäuseturm (Mouse Tower)", town:"Bingen", built:"Toll tower from 1298 (current tower 19th c.)", builtRu:"таможенная башня с 1298 года (нынешняя башня — XIX век)",
    facts:"This small tower stands on a tiny island. From 1298, it collected river tolls for the Archbishop of Mainz. French troops destroyed it in 1689. The tower you see today was rebuilt in 1855.",
    factsRu:"Эта маленькая башня стоит на крошечном острове. С 1298 года она собирала речную пошлину для архиепископа Майнца. Французские войска разрушили её в 1689 году. Башня, которую вы видите сегодня, была восстановлена в 1855 году." },
  { id:"hildegard", name:"Abtei St. Hildegard (\"Abbey of St. Hildegard\")", town:"Eibingen, near Rüdesheim", built:"Founded 1165 (present building early 1900s)", builtRu:"основан в 1165 году (нынешнее здание — начало XX века)",
    facts:"Up on the hill stands the Abbey of Saint Hildegard. Hildegard von Bingen lived here in the 1100s. She was a nun, a writer, a doctor, and a composer — all at the same time.",
    factsRu:"На холме стоит аббатство Святой Хильдегарды. Хильдегарда Бингенская жила здесь в XII веке. Она была монахиней, писательницей, врачом и композитором — всё сразу." },
  { id:"bromserburg", name:"Bromserburg", town:"Rüdesheim am Rhein", built:"1210", builtRu:"1210 год",
    facts:"Built in 1210, it's the oldest building in Rüdesheim. Today it's a wine museum. This is the end of our castle route — right across the river from Bingen.",
    factsRu:"Построен в 1210 году, это старейшее здание Рюдесхайма. Сегодня здесь музей вина. Это конец нашего маршрута по замкам — прямо напротив Бингена, на другом берегу реки." }
];

const UI = {
  en: { tabs:['Guide','Castles','Map','Legends','Info','Route'], stationLabel:(n,t)=>`Station ${n} of ${t}`, built:'Built', town:'Town', play:'Listen', check:'Mark as visited' },
  ru: { tabs:['Гид','Замки','Карта','Легенды','Инфо','Маршрут'], stationLabel:(n,t)=>`Остановка ${n} из ${t}`, built:'Построен', town:'Город', play:'Слушать', check:'Отметить как посещено' }
};

let lang = 'en';
let index = 2; // start on Marksburg
let scale = 1;
const visited = new Set();

const tabsEl = document.getElementById('tabs');
function renderTabs(){
  tabsEl.innerHTML = '';
  UI[lang].tabs.forEach((label, i) => {
    const s = document.createElement('span');
    s.className = 'tab' + (i === 0 ? ' active' : '');
    s.textContent = label;
    tabsEl.appendChild(s);
  });
}

function render(){
  const s = STATIONS[index];
  const t = UI[lang];
  document.getElementById('photoImg').src = s.id + '.jpg';
  document.getElementById('photoImg').alt = s.name.replace(/\s*\(.*\)/, '');
  document.getElementById('badge').textContent = t.stationLabel(index + 1, STATIONS.length);
  document.getElementById('stationTitle').textContent = s.name;
  document.getElementById('stationDesc').textContent = lang === 'ru' ? s.factsRu : s.facts;
  document.getElementById('statTownLabel').textContent = t.town;
  document.getElementById('statTown').textContent = s.town;
  document.getElementById('statBuiltLabel').textContent = t.built;
  document.getElementById('statBuilt').textContent = lang === 'ru' ? s.builtRu : s.built;
  document.getElementById('playLabel').textContent = t.play;
  document.getElementById('checkBtn').setAttribute('aria-label', t.check);
  document.getElementById('checkBtn').classList.toggle('done', visited.has(s.id));
  document.getElementById('progressFill').style.width = ((index + 1) / STATIONS.length * 100) + '%';
  document.getElementById('progressLabel').textContent = `${index + 1} / ${STATIONS.length}`;
  document.getElementById('prevBtn').disabled = index === 0;
  document.getElementById('nextBtn').disabled = index === STATIONS.length - 1;
  renderTabs();
  document.documentElement.style.setProperty('--scale', scale);
}

document.getElementById('prevBtn').addEventListener('click', () => { if (index > 0) { index--; render(); } });
document.getElementById('nextBtn').addEventListener('click', () => { if (index < STATIONS.length - 1) { index++; render(); } });
document.getElementById('checkBtn').addEventListener('click', () => {
  const id = STATIONS[index].id;
  if (visited.has(id)) visited.delete(id); else visited.add(id);
  render();
});
document.querySelectorAll('.pill-btn[data-lang]').forEach(btn => {
  btn.addEventListener('click', () => {
    lang = btn.getAttribute('data-lang');
    document.querySelectorAll('.pill-btn[data-lang]').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });
});
document.getElementById('fontMinus').addEventListener('click', () => { scale = Math.max(0.85, scale - 0.1); render(); });
document.getElementById('fontPlus').addEventListener('click', () => { scale = Math.min(1.4, scale + 0.1); render(); });

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
