<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#B5602E">
<title>Rhine Guide — Design-Test</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --parchment: #F6EEDD;
    --parchment-deep: #EFE0BE;
    --gold: #C9A05C;
    --terracotta: #B5602E;
    --ink: #5A4327;
    --ink-soft: #8A6A34;
    --cream-text: #FCEFDD;
    --pad: clamp(16px, 5vw, 24px);
    --sans: system-ui, -apple-system, sans-serif;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--parchment);
    font-family: 'EB Garamond', serif;
    color: var(--ink);
    height: 100%;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    overflow: hidden;
  }

  .header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px var(--pad) 12px;
    border-bottom: 1px solid var(--gold);
  }

  .app-name { font-size: clamp(15px, 4vw, 18px); font-weight: 600; margin: 0; }

  .header-controls { display: flex; align-items: center; gap: 6px; font-family: var(--sans); }

  .pill-btn {
    background: var(--parchment-deep);
    border: 1px solid var(--gold);
    color: var(--ink-soft);
    border-radius: 8px;
    font-size: 12px;
    padding: 4px 8px;
    line-height: 1;
  }

  .pill-btn.active { background: var(--terracotta); color: var(--cream-text); border-color: var(--terracotta); }

  .tabs {
    flex: 0 0 auto;
    display: flex;
    overflow-x: auto;
    gap: 8px;
    padding: 12px var(--pad) 14px;
    font-family: var(--sans);
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }

  .tab {
    flex: 0 0 auto;
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 20px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .tab.active { background: var(--terracotta); color: var(--cream-text); font-weight: 500; }

  .content { flex: 1 1 auto; overflow-y: auto; padding: 0 var(--pad) var(--pad); max-width: 480px; margin: 0 auto; width: 100%; }

  .photo {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    margin: 6px 0 22px;
    border-radius: 14px;
    overflow: hidden;
    background: linear-gradient(180deg, #E8D9B5 0%, #D9C193 55%, #B98B4F 100%);
  }

  .photo img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: rgba(180, 90, 40, 0.9);
    color: var(--cream-text);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-family: var(--sans);
  }

  .photo-icon { font-size: clamp(24px, 6vw, 32px); color: var(--cream-text); opacity: 0.7; margin-bottom: clamp(30px, 9vh, 46px); }

  .title-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 20px 18px;
    text-align: center;
    background: linear-gradient(0deg, rgba(74,42,17,0.72) 0%, rgba(74,42,17,0) 100%);
  }

  .title-overlay p { margin: 0; font-size: clamp(19px, 5.5vw, 25px); font-weight: 600; color: var(--cream-text); }

  .desc { margin: 0 auto 22px; max-width: 34ch; text-align: center; font-size: clamp(15px, 4vw, 16px); line-height: 1.65; }

  .stats { display: flex; gap: 14px; margin-bottom: 22px; }
  .stat { flex: 1; background: var(--parchment-deep); border-radius: 10px; padding: 12px 10px; text-align: center; }
  .stat p:first-child { margin: 0 0 4px; font-size: 11px; color: var(--ink-soft); font-family: var(--sans); }
  .stat p:last-child { margin: 0; font-size: 15px; font-weight: 600; }

  .actions { display: flex; gap: 12px; margin-bottom: 8px; }
  .btn-play {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--terracotta); color: var(--cream-text); border: none; border-radius: 10px;
    padding: 12px; font-family: var(--sans); font-size: 15px; font-weight: 500;
  }
  .btn-check {
    width: 48px; display: flex; align-items: center; justify-content: center;
    background: transparent; border: 1.5px solid var(--gold); border-radius: 10px;
    color: var(--ink-soft); font-size: 20px;
  }

  .footer {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px var(--pad);
    border-top: 1px solid var(--gold);
    font-family: var(--sans);
  }

  .nav-arrow {
    background: var(--parchment-deep);
    border: 1px solid var(--gold);
    color: var(--ink);
    border-radius: 10px;
    width: 36px; height: 36px;
    font-size: 16px;
  }

  .progress-track { flex: 1; height: 6px; background: var(--parchment-deep); border-radius: 3px; overflow: hidden; }
  .progress-fill { width: 18.75%; height: 100%; background: var(--terracotta); }
  .progress-label { font-size: 11px; color: var(--ink-soft); white-space: nowrap; }

  @media (max-width: 340px) {
    .stats { flex-direction: column; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <p class="app-name">Rhine Guide</p>
    <div class="header-controls">
      <span class="pill-btn active">RU</span>
      <span class="pill-btn">EN</span>
      <span class="pill-btn">A-</span>
      <span class="pill-btn">A+</span>
    </div>
  </div>

  <div class="tabs">
    <span class="tab active">Guide</span>
    <span class="tab">Castles</span>
    <span class="tab">Map</span>
    <span class="tab">Legends</span>
    <span class="tab">Info</span>
    <span class="tab">On the route</span>
  </div>

  <div class="content">
    <div class="photo">
      <img src="marksburg.jpg" alt="Marksburg">
      <div class="badge">Station 3 von 16</div>
      <div class="title-overlay"><p>Marksburg</p></div>
    </div>

    <p class="desc">Die einzige Burg am Mittelrhein, die nie zerstört wurde — hoch über Braubach, seit dem 12. Jahrhundert Wache haltend über den Fluss.</p>

    <div class="stats">
      <div class="stat"><p>Dauer</p><p>12 Min</p></div>
      <div class="stat"><p>Entfernung</p><p>0,4 km</p></div>
    </div>

    <div class="actions">
      <button class="btn-play">&#9654; Vorlesen</button>
      <button class="btn-check" aria-label="Als besucht markieren">&#10003;</button>
    </div>
  </div>

  <div class="footer">
    <button class="nav-arrow" aria-label="Vorherige Station">&#8592;</button>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <span class="progress-label">3 / 16</span>
    <button class="nav-arrow" aria-label="Nächste Station">&#8594;</button>
  </div>

</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
